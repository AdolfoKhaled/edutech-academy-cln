# DB + App + Tests en un entorno reproducible.
#   docker compose up --build db app        -> API en http://localhost:8000/docs
#   docker compose run --rm tests           -> pruebas contra PostgreSQL
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edutech}
      POSTGRES_USER: ${POSTGRES_USER:-edutech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edutech_local}
    ports:
      - "5432:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edutech} -d ${POSTGRES_DB:-edutech}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edutech}:${POSTGRES_PASSWORD:-edutech_local}@db:5432/${POSTGRES_DB:-edutech}
      APP_ENV: ${APP_ENV:-docker}
      CARGAR_DATOS_DEMO: ${CARGAR_DATOS_DEMO:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  tests:
    build:
      context: .
      args:
        INSTALAR_DEV: "true"
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edutech}:${POSTGRES_PASSWORD:-edutech_local}@db:5432/${POSTGRES_DB:-edutech}
    command: ["python", "-m", "pytest", "-v", "--cov=src", "--cov-report=term-missing", "--cov-fail-under=80"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tests"]

volumes:
  datos_db:
