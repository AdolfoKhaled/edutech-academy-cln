# Despliegue en Render (Blueprint): New + > Blueprint > elegir este repositorio.
# Crea la base PostgreSQL gratuita y el servicio web con el Dockerfile.
databases:
  - name: edutech-db
    plan: free
    databaseName: edutech
    user: edutech

services:
  - type: web
    name: edutech-academy-api
    runtime: docker
    plan: free
    healthCheckPath: /salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edutech-db
          property: connectionString
      - key: APP_ENV
        value: produccion
      - key: CARGAR_DATOS_DEMO
        value: "true"
      - key: ROLES_DEMO
        value: inst-1:Instructor;inst-2:Instructor;ce-1:ControlEscolar;coord-1:CoordinacionAcademica
