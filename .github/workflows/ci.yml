name: CI/CD EduTech Academy
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  calidad:
    name: Lint + pruebas (SQLite y PostgreSQL) + cobertura
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edutech
          POSTGRES_USER: edutech
          POSTGRES_PASSWORD: edutech_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edutech" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://edutech:edutech_ci@localhost:5432/edutech
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (Ruff)
        run: ruff check src tests scripts
      - name: Pruebas unitarias e integración con cobertura >= 80 %
        run: pytest -v --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Casos del paquete del profesor
        run: python scripts/ejecutar_casos.py
      - name: Exportar OpenAPI
        run: python scripts/exportar_openapi.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-ci
          path: |
            coverage.xml
            evidencias/resultados_*.csv
            docs/api/openapi.json

  docker:
    name: Build de la imagen y prueba con Docker Compose
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas dentro de Docker Compose (DB + Tests)
        run: docker compose --profile tests run --rm tests
      - name: Levantar DB + App y comprobar /salud
        run: |
          docker compose up -d --build db app
          for i in $(seq 1 30); do curl -fs http://localhost:8000/salud && break; sleep 2; done
          curl -fs http://localhost:8000/salud
          curl -fs http://localhost:8000/openapi.json > /dev/null
      - if: always()
        run: docker compose down -v

  despliegue:
    name: Despliegue (Render)
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Disparar el despliegue en Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Sin secreto RENDER_DEPLOY_HOOK: Render despliega solo con cada push (auto-deploy)."
          else
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          fi
